<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BibliOS | Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body.login-page{min-height:100vh;margin:0;padding:24px;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#d9dde1 0%,#c8cdd2 55%,#b9c0c6 100%);font-family:Arial,sans-serif}
    .login-card{width:100%;max-width:520px;background:#fff;padding:42px 48px;border-radius:18px;
      box-shadow:0 18px 55px rgba(0,0,0,.25)}
    .login-brand{text-align:center;margin-bottom:30px}
    .login-icon{width:64px;height:64px;margin:0 auto 15px;border-radius:18px;background:#e8f3ed;
      display:flex;align-items:center;justify-content:center;font-size:31px}
    .login-brand h1{margin:0;color:#1d5945;font-size:32px;letter-spacing:.3px}
    .login-brand p{margin:8px 0 0;color:#748078;font-size:14px}
    .login-card h2{font-size:21px;color:#26352d;margin:0 0 7px}
    .login-intro{font-size:14px;color:#7b847e;margin:0 0 25px}
    .login-field{margin-bottom:18px}
    .login-field label{display:block;font-size:13px;font-weight:700;color:#39473f;margin-bottom:8px}
    .login-field input{width:100%;padding:13px 14px;border:1px solid #dce4de;border-radius:9px;
      font-size:15px;outline:none;box-sizing:border-box}
    .login-field input:focus{border-color:#2d7658;box-shadow:0 0 0 3px rgba(45,118,88,.12)}
    .login-submit{width:100%;border:0;border-radius:9px;padding:14px;background:#246447;color:#fff;
      font-size:15px;font-weight:700;cursor:pointer;margin-top:5px}
    .login-submit:hover{background:#194d35}
    .login-error{display:none;color:#b42318;background:#fff0ef;border-radius:8px;padding:10px 12px;
      font-size:13px;margin:0 0 15px}
    .login-demo{text-align:center;font-size:12px;color:#89928c;margin-top:22px;line-height:1.7}
    .login-footer{text-align:center;color:rgba(255,255,255,.7);font-size:12px;margin-top:18px}
    @media(max-width:480px){.login-card{padding:32px 24px}}
  </style>
</head>
<body class="login-page">
  <main>
    <section class="login-card">
      <div class="login-brand">
        <div class="login-icon">📚</div>
        <h1>BibliOS</h1>
        <p>Sistema de Gestão de Biblioteca</p>
      </div>
      <h2>Bem-vindo de volta!</h2>
      <p class="login-intro">Entre com seus dados para acessar o sistema.</p>
      <div class="login-error" id="loginError" role="alert">E-mail ou senha incorretos. Tente novamente.</div>
      <form id="loginForm">
        <div class="login-field">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seuemail@exemplo.com" autocomplete="username" required>
        </div>
        <div class="login-field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
        </div>
        <button class="login-submit" type="submit">Entrar no sistema</button>
      </form>
      <p class="login-demo">Acesso para demonstração:<br><strong>admin@biblios.com</strong> · <strong>123456</strong></p>
    </section>
    <p class="login-footer">© BibliOS · Gestão simples e organizada</p>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const senha = document.getElementById('senha').value;
      if (email === 'admin@biblios.com' && senha === '123456') {
        window.location.href = 'painel.html';
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    });
  </script>
</body>
</html>
