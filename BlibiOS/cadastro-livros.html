<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>BibliOS - Cadastro de Livros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a href="index.php" class="link-voltar">← Voltar para o Menu</a>

    
    <h1 class="titulo-pagina-cadastro">Cadastro de Livros</h1>

  
    <div class="caixa-formulario">
        
        <form action="salvar.php" method="post" enctype="multipart/form-data">
            
            <div class="campo-grupo">
                <label for="titulo" class="rotulo-principal">Título do livro:</label>
                <input type="text" id="titulo" name="titulo" class="caixa-entrada" placeholder="DIGITE O TÍTULO" required>
            </div>

            <div class="campo-grupo">
                <label for="autor" class="rotulo-principal">Autor:</label>
                <input type="text" id="autor" name="autor" class="caixa-entrada" placeholder="DIGITE O AUTOR" required>
            </div>

            <div class="campo-grupo">
                <label for="genero" class="rotulo-principal">Gênero:</label>
                <input type="text" id="genero" name="genero" class="caixa-entrada" placeholder="DIGITE O GÊNERO" required>
            </div>

            <div class="campo-grupo">
                <label for="capa" class="rotulo-principal">Upload de capa:</label>
                <input type="file" id="capa" name="capa" class="caixa-entrada" required>
            </div>

            <div class="campo-grupo">
                <label for="status" class="rotulo-principal">Status:</label>
              
                <select name="status" id="status" class="caixa-entrada" required>
                    <option value="ativo">Ativo</option>
                    <option value="inativo">Inativo</option>
                </select>
            </div>

            <button type="submit" class="botao-salvar">Salvar</button>
            
        </form>
        
    </div>

</body>
</html>
