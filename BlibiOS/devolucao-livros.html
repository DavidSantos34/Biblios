<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- RESOLVE O BUG DOS CARACTERES ESTRANHOS (Acentuação) -->
    <meta charset="UTF-8">
    <title>BibliOS - Devolução de Livros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a href="index.html" class="link-voltar">← Voltar para o Menu</a>

    <h1 class="titulo-pagina-cadastro">Devolução de Livros</h1>

    <div class="caixa-formulario">
        
        <form action="salvar_devolucao.php" method="post">
          
            <!-- Bloco de resumo com as imagens e nomes lado a lado -->
            <div class="resumo-devolucao">
                <div class="resumo-item">
                    <img src="foto.jpg" alt="Foto do Leitor" width="60" height="60" class="foto-perfil">
                    <p>João Silva</p>
                </div>
                
                <div class="sinal-mais">+</div>
                
                <div class="resumo-item">
                    <img src="capa.jpg" alt="Capa do Livro" width="50" height="70" class="capa-livro">
                    <p>1984</p>
                </div>
            </div>

            <div class="campo-grupo">
                <label for="data_devolucao" class="rotulo-principal">Data de devolução:</label>
                <input type="date" id="data_devolucao" name="data_devolucao" class="caixa-entrada" required>
            </div>

            <div class="campo-grupo">
                <label for="observacao_devolucao" class="rotulo-principal">Observação de devolução:</label>
                <textarea id="observacao_devolucao" name="observacao_devolucao" class="caixa-textarea" rows="4" placeholder="O livro sofreu algum dano?"></textarea>
            </div>

            <button type="submit" class="botao-salvar">Dar baixa</button>
            
        </form>
        
    </div>

</body>
</html>
